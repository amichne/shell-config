# Generated by the local prompt editor.
# Remote counts use local tracking refs; PR information is explicitly refreshed.
"$schema" = "https://starship.rs/config-schema.json"
palette = "codex"
format = '$directory${custom.git_context}$cmd_duration$status$line_break$character'
add_newline = true
command_timeout = 1200

[palettes.codex]
directory = "#3a83f7"
git = "#bd93f9"
muted = "#9296ad"
success = "#50fa7b"
error = "#ff5555"
background = "#282a36"

[directory]
format = '[$path]($style)[$read_only]($read_only_style) '
style = 'bold directory'
truncation_length = 3
truncate_to_repo = false
truncation_symbol = '…/'
read_only = ' read-only'

[custom.git_context]
command = 'shell-prompt context --ansi --settings '
when = true
shell = ['sh']
format = '$output '

[cmd_duration]
min_time = 1500
format = '[took $duration](muted) '

[status]
disabled = false
format = '[exit:$status](error) '

[character]
success_symbol = '[\$](success)'
error_symbol = '[\$](error)'
vimcmd_symbol = '[❮](success)'
